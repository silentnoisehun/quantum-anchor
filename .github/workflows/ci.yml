name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  model:
    name: "Classical model (NOT hardware evidence)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The model must run on the standard library alone. There is no
      # third-party dependency in this project, and adding one would break
      # the guarantee that the ledger can be checked without an IBM account.
      #
      # The check is STATIC (it parses the project's own import statements)
      # rather than reading sys.modules, because the interpreter preloads
      # platform modules such as pywin32_* that have nothing to do with this
      # project and would fail the assertion for the wrong reason.
      - name: "Dependency audit — stdlib only"
        run: python -m src.check_no_dependencies

      - name: "Run the model evaluation"
        run: python -m src.anchor_model

  measure:
    name: "Simulation sweep (NOT hardware evidence)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install simulators"
        run: python -m pip install --upgrade qiskit qiskit-aer qiskit-ibm-runtime

      # This asserts the three verdicts the paper's physics must satisfy, so a
      # regression in the measurement layer fails the build instead of quietly
      # changing the numbers in docs/VALIDATION.md.
      - name: "Rabi relation and reversibility must hold"
        run: |
          python -m src.anchor_measure --shots 2000 --assert-verdicts

      - name: "Same sweep under a noise model"
        run: python -m src.anchor_measure --backend FakeKyiv --shots 2000

      # The measurement layer must keep saying out loud that it is simulation.
      # A future edit that turns a green run into an implied hardware claim
      # should fail here rather than mislead a reader.
      - name: "The output must still declare itself simulation"
        run: |
          python -m src.anchor_measure --shots 200 > out.txt
          grep -q "SIMULATION" out.txt || { echo "::error::evidence-grade banner missing"; exit 1; }
          grep -q "No QPU" out.txt || { echo "::error::hardware disclaimer missing"; exit 1; }
          grep -q "Nothing here ran on a Heron processor" out.txt \
            || { echo "::error::hardware disclaimer missing"; exit 1; }
          echo "clean: simulation clearly labelled"

  secrets:
    name: "No credential committed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Assert no real .env is tracked"
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::a real .env file is tracked"
            exit 1
          fi
          echo "clean: no tracked .env"

      - name: "Assert placeholder values only"
        run: |
          # The template is safe to ship; make sure it holds placeholders.
          if grep -qE 'IBM_QUANTUM_API_TOKEN=[A-Za-z0-9_-]{20,}' config/.env.template; then
            echo "::error::config/.env.template appears to contain a real token"
            exit 1
          fi
          echo "clean: placeholders only"
